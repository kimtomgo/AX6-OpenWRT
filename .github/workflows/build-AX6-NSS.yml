name: Build OpenWRT for AX6-NSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-AX6-NSS.yml
      - AX6-IPQ/.config
      - AX6-IPQ/diy.sh
      - AX6-IPQ/files/**
      - AX6-IPQ/frp/**

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  CONFIG_FILE: AX6-IPQ/.config
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai
  REPO_COMMIT: f9b0ce7650fdcc7f4793256a3ae43c1132e2bc49

permissions:
  contents: write

concurrency:
  group: ax6-nss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Check machine configuration
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "云编译建议取消勾选Node.js及其相关插件！"
        echo "已知CPU型号（降序）：7763,8370C,8272CL,8171M,E5系列"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo "--------------------------硬盘信息--------------------------"
        echo -e  "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "硬盘详情："
        df -Th
        
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        ROOT_AVAIL_GB="$(df -BG / | awk 'NR==2 {gsub(/G/, "", $4); print $4}')"
        echo "Root filesystem available: ${ROOT_AVAIL_GB}G"
        if [ "${ROOT_AVAIL_GB}" -lt 50 ]; then
          echo "ERROR: less than 50 GB remains on root filesystem; refusing to start apt/build" >&2
          exit 1
        fi
        echo "=============================================================================="
        
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq install -y \
          build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3 python3-distutils-extra \
          python3-setuptools rsync swig unzip zlib1g-dev file wget patch subversion
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Verify eBPF build tools
      run: |
        command -v clang
        command -v llvm-strip
        clang --version
        llvm-strip --version

    - name: Clone source code
      working-directory: ./
      run: |
        git clone $REPO_URL openwrt
        git -C openwrt checkout --detach "$REPO_COMMIT"
        test "$(git -C openwrt rev-parse HEAD)" = "$REPO_COMMIT"
        echo "ImmortalWrt source: $REPO_COMMIT"

    - name: cache wrt build
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: AX6-NSS-${{ env.REPO_COMMIT }}
        prefix: ${{ github.workspace }}/openwrt
        
    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom config
      run: |
        [ -e $FILES ] && mv $FILES openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SH

    # - name: SSH connect to Actions
      # uses: P3TERX/ssh2actions@main
      # if: (github.event.inputs.ssh == 'true') || contains(github.event.action, 'ssh')

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        # Linux 6.18 bonding triggers unused-function warnings; defconfig may re-enable WERROR.
        sed -i 's/^CONFIG_KERNEL_WERROR=y$/# CONFIG_KERNEL_WERROR is not set/' .config
        make defconfig
        grep -qx 'CONFIG_TARGET_PROFILE="DEVICE_redmi_ax6-stock"' .config
        grep -qx 'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6-stock=y' .config
        echo "Verified target: Redmi AX6 stock partition layout"
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        set -o pipefail
        if ! make -j"$(nproc)" V=s 2>&1 | tee ../compile.log; then
          if grep -Eiq 'out of memory|Killed process|fatal error: Killed signal' ../compile.log; then
            echo "Detected probable OOM; retrying serially once"
            make -j1 V=s 2>&1 | tee ../compile-retry.log
          else
            echo "Build failed for a non-OOM reason; not wasting quota on blind retries" >&2
            exit 1
          fi
        fi
        echo "compile_status=success" >> $GITHUB_ENV

    # - name : Upload packages
      # uses: actions/upload-artifact@master
      # if: always()
      # with:
        # name: AX6-NSS
        # path: openwrt/bin/targets
    - name: Validate and stage Redmi AX6 stock-layout images
      run: |
        set -euo pipefail
        TARGET_DIR="openwrt/bin/targets/qualcommax/ipq807x"
        test -d "$TARGET_DIR"
        FACTORY="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*redmi_ax6-stock*squashfs-factory.ubi' -print -quit)"
        SYSUPGRADE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*redmi_ax6-stock*squashfs-sysupgrade.bin' -print -quit)"
        test -n "$FACTORY" && test -s "$FACTORY"
        test -n "$SYSUPGRADE" && test -s "$SYSUPGRADE"
        MANIFEST="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*redmi_ax6-stock.manifest' -print -quit)"
        test -n "$MANIFEST" && test -s "$MANIFEST"
        for pkg in kmod-ath11k kmod-qca-nss-drv kmod-qca-nss-ecm dae luci-app-dae xray-core sing-box tailscale zerotier wireguard-tools frpc; do
          if ! grep -qE "^${pkg}[[:space:]]" "$MANIFEST"; then
            echo "ERROR: expected package missing from image manifest: $pkg" >&2
            exit 1
          fi
        done
        mkdir -p upload
        cp "$FACTORY" "$SYSUPGRADE" "$MANIFEST" upload/
        cp openwrt/.config upload/build.config
        cp openwrt/feeds.buildinfo upload/ 2>/dev/null || true
        cp openwrt/version.buildinfo upload/ 2>/dev/null || true
        printf 'source_commit=%s\nprofile=redmi_ax6-stock\n' "$REPO_COMMIT" > upload/BUILDINFO.txt
        (cd upload && sha256sum * > SHA256SUMS)
        echo "Validated firmware outputs:"
        ls -lh upload/
        cat upload/SHA256SUMS
        df -hT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-AX6-stock-ImmortalWrt
        path: upload/*
        if-no-files-found: error
        retention-days: 14

    - name: Get Current Date
      run: echo "CURRENT_DATE=$(date '+%Y%m%d%H%M%S')" >> $GITHUB_ENV
      
    - name: Upload OpenWrt Firmware to Release
      uses: ncipollo/release-action@main
      with:
        tag: AX6_NSS_${{ env.CURRENT_DATE }}
        artifacts: upload/*
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ## Redmi AX6 · ImmortalWrt (NSS)

          基于锁定源码提交 `${{ env.REPO_COMMIT }}` 构建，目标为 **Redmi AX6 原厂 U-Boot / 原厂分区布局（redmi_ax6-stock）**。

          > 本固件不要求刷入大分区/第三方 U-Boot。刷写前仍须核对设备型号、分区布局和 SHA256；不要将其他 AX6 变体镜像混用。

          ### 预装功能
          - PassWall（Xray + Sing-box）
          - dae（使用 ImmortalWrt 24.10 内置包）
          - DDNS-Go、Socat、UPnP
          - Tailscale、ZeroTier、WireGuard、frpc

          ### 固件文件
          | 文件 | 用途 |
          | --- | --- |
          | `*redmi_ax6-stock*squashfs-factory.ubi` | Factory 镜像，原厂固件环境首次刷入时使用；请按 AX6 stock-layout 专用流程操作 |
          | `*redmi_ax6-stock*squashfs-sysupgrade.bin` | 已运行兼容的 OpenWrt/ImmortalWrt 时升级使用 |

          发布包附带 manifest、构建配置、源码提交信息和 `SHA256SUMS`。不要将 Factory 与 Sysupgrade 镜像混用。

          ### 默认登录
          | 项 | 值 |
          | --- | --- |
          | 地址 | `http://192.168.1.1` |
          | 账户 | `root` |
          | 密码 | 空（首次登录后请自行设置） |

    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        keep_latest: 10
        delete_tags : true
